name: Rapport de bug
description: Signaler un dysfonctionnement ou une régression
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Merci de vérifier qu'un rapport similaire n'est pas déjà ouvert.
  - type: input
    id: version
    attributes:
      label: Version
      description: Release (vX.Y.Z), artefact du workflow Build ou commit utilisé.
    validations:
      required: true
  - type: input
    id: environnement
    attributes:
      label: Environnement
      description: Système d'exploitation et architecture (linux-x64, win-x64, osx-arm64, osx-x64), clavier ou manette.
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Description du problème
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Étapes de reproduction
      placeholder: |
        1. ...
        2. ...
    validations:
      required: true
  - type: textarea
    id: attendu
    attributes:
      label: Comportement attendu
    validations:
      required: true
  - type: textarea
    id: contexte
    attributes:
      label: Informations complémentaires
      description: Sortie console, captures d'écran, étape (route) concernée...
