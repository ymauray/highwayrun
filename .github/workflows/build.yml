name: Build

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build (${{ matrix.rid }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            rid: linux-x64
            archive: highwayrun-linux-x64.tar.gz
          - os: windows-latest
            rid: win-x64
            archive: highwayrun-win-x64.zip
          - os: macos-latest
            rid: osx-arm64
            archive: highwayrun-osx-arm64.tar.gz
          - os: macos-latest
            rid: osx-x64
            archive: highwayrun-osx-x64.tar.gz

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.x'

      # Binaire unique autonome : framework .NET et bibliothèque native raylib embarqués
      # (réglages dans HighwayRun.csproj, actifs dès qu'un RuntimeIdentifier est donné)
      - name: Publish
        run: dotnet publish HighwayRun.csproj -c Release -r ${{ matrix.rid }} -o out

      - name: Archive (Linux / macOS)
        if: runner.os != 'Windows'
        run: tar -czf ${{ matrix.archive }} -C out highwayrun

      - name: Archive (Windows)
        if: runner.os == 'Windows'
        run: Compress-Archive -Path out\highwayrun.exe -DestinationPath ${{ matrix.archive }}

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.archive }}
          path: ${{ matrix.archive }}

  release:
    name: Create Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: dist/*
          generate_release_notes: true
